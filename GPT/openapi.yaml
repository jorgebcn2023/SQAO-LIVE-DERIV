openapi: 3.1.0
info:
  title: SQAO Live Deriv API
  version: 2.5.0
  description: >-
    Read-only Deriv Synthetic Index analytics API. V2.5 adds OCR visual audit
    and fail-closed synchronized MTF data-quality controls. Snapshot requires
    timestamped closed D1, H4, H1, M15, M5 and M1 candles. No trading operations
    are exposed. Incomplete or unverified evidence must result in NO_TRADE.
servers:
  - url: https://sqao-live-api-v2.onrender.com
paths:
  /health:
    get:
      operationId: health
      summary: Check API, connector and market-data freshness
      security: []
      responses:
        '200':
          description: API and market data health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, degraded]}
                  service: {type: string}
                  version: {type: string}
                  read_only: {type: boolean}
                  background_connector_enabled: {type: boolean}
                  background_connector_running: {type: boolean}
                  background_connector_started_at_utc: {type: [string, 'null']}
                  background_connector_error: {type: [string, 'null']}
                  market_data:
                    type: object
                    properties:
                      max_data_age_seconds: {type: integer}
                      all_timeframes_fresh: {type: boolean}
                      timeframes: {type: object, additionalProperties: true}
  /market/active-symbols:
    get:
      operationId: getActiveStepSymbols
      summary: Discover actual active Deriv Step Index symbols
      security: []
      responses:
        '200':
          description: Active symbols and display names
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /market/ohlc:
    get:
      operationId: getStepOHLC
      summary: Retrieve closed OHLC candles for one timeframe
      security: []
      parameters:
        - name: symbol
          in: query
          required: false
          schema: {type: string, default: AUTO}
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [M1, M5, M15, H1, H4, D1]
            default: M1
        - name: count
          in: query
          required: false
          schema: {type: integer, minimum: 20, maximum: 500, default: 500}
      responses:
        '200':
          description: Timestamped OHLC candle series
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '502':
          description: Deriv upstream error or insufficient data
  /analysis/snapshot:
    get:
      operationId: getSQAOQuantSnapshot
      summary: Retrieve complete live synchronized MTF quantitative snapshot
      description: >-
        Resolves AUTO to the actual active Step Index symbol and returns closed
        D1/H4/H1/M15/M5/M1 OHLC with timestamps, synchronization audit and
        conservative research decision. Never assume a symbol or manufacture
        missing prices. Unverified all-in costs or failed OOS gates require
        NO_TRADE.
      security: []
      parameters:
        - name: symbol
          in: query
          required: false
          schema: {type: string, default: AUTO}
        - name: count
          in: query
          required: false
          schema: {type: integer, minimum: 20, maximum: 500, default: 500}
      responses:
        '200':
          description: Live MTF snapshot and data-quality gate
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '502':
          description: Deriv upstream error, missing frames or insufficient candles
