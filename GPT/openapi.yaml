openapi: 3.1.0
info:
  title: SQAO Live Deriv API
  version: 2.1.0
  description: >-
    Read-only live Deriv Step Index market-data API. The snapshot returns D1,
    H1, M15, M5 and M1 candles and quantitative indicators. Scenario estimates
    are not historical win rates or guarantees. No trading operations are exposed.
servers:
  - url: https://sqao-live-api.onrender.com
paths:
  /health:
    get:
      operationId: health
      summary: Check API and background connector health
      security: []
      responses:
        '200':
          description: API status and connector state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  service: {type: string}
                  version: {type: string}
                  read_only: {type: boolean}
                  background_connector_enabled: {type: boolean}
                  background_connector_running: {type: boolean}
  /market/active-symbols:
    get:
      operationId: getActiveStepSymbols
      summary: List active Deriv Step Index symbols
      responses:
        '200':
          description: Active Step Index symbols
          content:
            application/json:
              schema:
                type: object
  /market/ohlc:
    get:
      operationId: getStepOHLC
      summary: Get recent OHLC candles from Deriv
      parameters:
        - name: symbol
          in: query
          required: false
          schema: {type: string, default: AUTO}
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [M1, M5, M15, H1, D1]
            default: M1
        - name: count
          in: query
          required: false
          schema: {type: integer, minimum: 20, maximum: 500, default: 120}
      responses:
        '200':
          description: OHLC candles
          content:
            application/json:
              schema:
                type: object
  /analysis/snapshot:
    get:
      operationId: getSQAOQuantSnapshot
      summary: Get complete live multi-timeframe analysis
      description: >-
        Resolves symbol=AUTO against active Step Index symbols, retrieves
        D1/H1/M15/M5/M1 candles and computes the quantitative snapshot.
        Treat decisions and scenario probabilities as estimates, not guarantees.
      parameters:
        - name: symbol
          in: query
          required: false
          schema: {type: string, default: AUTO}
        - name: count
          in: query
          required: false
          schema: {type: integer, minimum: 20, maximum: 500, default: 120}
      responses:
        '200':
          description: Live MTF quantitative snapshot
          content:
            application/json:
              schema:
                type: object
