openapi: 3.1.0
info:
  title: SQAO Live Deriv API
  version: 2.0.0
  description: Read-only live Deriv Step Index market-data API for SQAO. The snapshot returns D1, H1, M15, M5 and M1 data plus conservative quantitative analysis. MODEL_ESTIMATE is not a historical win rate.
servers:
  - url: https://sqao-live-api.onrender.com
security:
  - SQAOKey: []
paths:
  /health:
    get:
      operationId: health
      summary: Check SQAO API health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
  /market/active-symbols:
    get:
      operationId: getActiveStepSymbols
      summary: List active Deriv Step Index symbols
      responses:
        '200':
          description: Active Step Index symbols
          content:
            application/json:
              schema:
                type: object
  /market/ohlc:
    get:
      operationId: getStepOHLC
      summary: Get recent live OHLC candles
      parameters:
        - name: symbol
          in: query
          required: false
          schema: {type: string, default: AUTO}
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [M1, M5, M15, H1, D1]
            default: M1
        - name: count
          in: query
          required: false
          schema: {type: integer, minimum: 20, maximum: 500, default: 120}
      responses:
        '200':
          description: Live OHLC candles
          content:
            application/json:
              schema:
                type: object
  /analysis/snapshot:
    get:
      operationId: getSQAOQuantSnapshot
      summary: Get complete live SQAO MTF snapshot
      description: Fetches an active Step Index automatically when symbol=AUTO, retrieves D1/H1/M15/M5/M1, computes EMA10/EMA20, RSI14, ATR14, 20-candle range, MTF alignment, conservative decision and 60-minute conditional scenarios.
      parameters:
        - name: symbol
          in: query
          required: false
          schema: {type: string, default: AUTO}
        - name: count
          in: query
          required: false
          schema: {type: integer, minimum: 20, maximum: 500, default: 120}
      responses:
        '200':
          description: Live MTF quantitative snapshot
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    SQAOKey:
      type: apiKey
      in: header
      name: X-SQAO-Key
