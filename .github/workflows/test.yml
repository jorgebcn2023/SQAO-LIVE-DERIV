name: SQAO tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ENGINE/requirements.txt -r API/requirements.txt
      - run: python -m compileall -q API AI ENGINE CONNECTOR
      - run: python -m ENGINE.tests
      - run: python -m ENGINE.test_step_index_quant
      - run: python -m ENGINE.live_pipeline
      - name: Deriv public WebSocket smoke test
        run: |
          python - <<'PY'
          import asyncio, json
          import websockets

          URL = 'wss://api.derivws.com/trading/v1/options/ws/public'

          async def main():
              async with websockets.connect(URL, open_timeout=15, close_timeout=5) as ws:
                  await ws.send(json.dumps({'active_symbols': 'brief', 'req_id': 1001}))
                  while True:
                      msg = json.loads(await asyncio.wait_for(ws.recv(), timeout=15))
                      if msg.get('error'):
                          raise RuntimeError(msg['error'])
                      if msg.get('req_id') == 1001 or msg.get('msg_type') == 'active_symbols':
                          break

                  steps = []
                  for item in msg.get('active_symbols', []):
                      name = str(item.get('underlying_symbol_name', item.get('display_name', '')))
                      symbol = str(item.get('underlying_symbol', item.get('symbol', '')))
                      if symbol and 'step index' in f'{name} {symbol}'.lower():
                          steps.append((name, symbol))
                  if not steps:
                      raise RuntimeError('No Step Index symbol returned by Deriv')

                  name, symbol = steps[0]
                  await ws.send(json.dumps({'ticks': symbol, 'subscribe': 1, 'req_id': 2000}))
                  while True:
                      tick = json.loads(await asyncio.wait_for(ws.recv(), timeout=15))
                      if tick.get('error'):
                          raise RuntimeError(tick['error'])
                      if tick.get('req_id') == 2000 and tick.get('tick', {}).get('quote') is not None:
                          print(f'DERIV_PUBLIC_WS_OK name={name} symbol={symbol} quote={tick["tick"]["quote"]}')
                          break

          asyncio.run(main())
          PY
      - name: Deriv live snapshot
        env:
          DERIV_SYMBOL: AUTO
          SQAO_HISTORY_CANDLES: '120'
        run: |
          timeout 30s python -m CONNECTOR.deriv_live || test $? -eq 124
          test -f DATA/live_analysis.json || { echo 'LIVE_ANALYSIS_NOT_CREATED'; exit 1; }
          python - <<'PY'
          import json
          with open('DATA/live_analysis.json', encoding='utf-8') as f:
              data=json.load(f)
          required={'D1','H1','M15','M5','M1'}
          if not required.issubset(set(data.get('timeframes', {}))):
              raise SystemExit('Incomplete MTF snapshot')
          print('LIVE_MTF_SNAPSHOT_OK')
          PY
