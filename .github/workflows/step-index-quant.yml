name: SQAO Step Index Quant Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'ENGINE/step_index_quant.py'
      - 'ENGINE/step_index_research.py'
      - 'ENGINE/step_index_strategy_lab.py'
      - 'ENGINE/step_index_advanced.py'
      - 'ENGINE/test_step_index_advanced.py'
      - 'ENGINE/step_index_arima_mc.py'
      - 'ENGINE/test_step_index_quant.py'
      - 'ENGINE/requirements.txt'
      - '.github/workflows/step-index-quant.yml'

permissions:
  contents: read

concurrency:
  group: sqao-step-index-quant
  cancel-in-progress: true

jobs:
  step-index-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ENGINE/requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r ENGINE/requirements.txt

      - name: Compile and test
        run: |
          python -m compileall -q ENGINE
          python -m ENGINE.test_step_index_quant
          python -m ENGINE.test_step_index_advanced
          python -m ENGINE.test_step_index_cost_sensitivity

      - name: Run Step Index OHLC research and generate PDF
        env:
          DERIV_PUBLIC_WS: wss://api.derivws.com/trading/v1/options/ws/public
          SQAO_STEP_CANDLES_M1: '5000'
          SQAO_STEP_CANDLES_M5: '20000'
          SQAO_STEP_CANDLES_M15: '7000'
          SQAO_STEP_CANDLES_H1: '2500'
          SQAO_STEP_CANDLES_D1: '1000'
          SQAO_STEP_CANDLES_W1: '260'
          SQAO_STEP_HORIZON_M5: '5'
          SQAO_STEP_TARGET_R: '1.5'
          SQAO_STEP_ATR_MULT: '1.2'
          SQAO_STEP_TRAIN_FRACTION: '0.70'
          SQAO_STEP_MIN_OOS_TRADES: '100'
          SQAO_STEP_TARGET_WIN_RATE: '0.70'
          SQAO_STEP_ROUND_TRIP_COST_PRICE: ${{ vars.SQAO_STEP_ROUND_TRIP_COST_PRICE }}
          SQAO_DATA_DIR: DATA
        run: python -m ENGINE.step_index_research

      - name: Run alternative Step Index strategy lab
        env:
          DERIV_PUBLIC_WS: wss://api.derivws.com/trading/v1/options/ws/public
          SQAO_LAB_M5_CANDLES: '20000'
          SQAO_LAB_M15_CANDLES: '7000'
          SQAO_LAB_H1_CANDLES: '2500'
          SQAO_STEP_MIN_OOS_TRADES: '100'
          SQAO_STEP_TARGET_WIN_RATE: '0.70'
          SQAO_STEP_ROUND_TRIP_COST_PRICE: ${{ vars.SQAO_STEP_ROUND_TRIP_COST_PRICE }}
          SQAO_DATA_DIR: DATA
        run: python -m ENGINE.step_index_strategy_lab

      - name: Run explicit hypothetical round-trip cost sensitivity
        env:
          SQAO_DATA_DIR: DATA
        run: python -m ENGINE.step_index_cost_sensitivity

      - name: Run ARIMA and 10,000-path Monte Carlo
        env:
          DERIV_PUBLIC_WS: wss://api.derivws.com/trading/v1/options/ws/public
          SQAO_ARIMA_SYMBOL: stpRNG
          SQAO_ARIMA_CANDLES: '5000'
          SQAO_ARIMA_GRANULARITY: '300'
          SQAO_ARIMA_HORIZON: '5'
          SQAO_MC_PATHS: '10000'
          SQAO_DATA_DIR: DATA
        run: python -m ENGINE.step_index_arima_mc

      - name: Validate JSON and PDF outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('DATA/step_index_quant_report.json').read_text(encoding='utf-8'))
          lab = json.loads(Path('DATA/step_index_strategy_lab.json').read_text(encoding='utf-8'))
          am = json.loads(Path('DATA/step_index_arima_mc.json').read_text(encoding='utf-8'))
          cost = json.loads(Path('DATA/step_index_cost_sensitivity.json').read_text(encoding='utf-8'))
          for name in ['step_index_quant_report.pdf','step_index_strategy_lab.pdf','step_index_arima_mc.pdf','step_index_cost_sensitivity.pdf']:
              if not Path('DATA', name).is_file() or Path('DATA', name).stat().st_size < 1000:
                  raise SystemExit(f'Missing/invalid PDF: {name}')
          if data.get('decision') not in {'NO_TRADE', 'CONDITIONAL_SETUP_REQUIRES_LIVE_CONFIRMATION'}:
              raise SystemExit('Unexpected baseline decision state')
          if lab.get('decision') not in {'NO_TRADE', 'CANDIDATE_FOR_REVIEW'} or len(lab.get('strategies', [])) != 3:
              raise SystemExit('Strategy lab output invalid')
          if not isinstance(lab.get('advanced_snapshot'), dict):
              raise SystemExit('Advanced diagnostics missing from strategy lab output')
          for item in lab.get('strategies', []):
              if 'advanced_bayesian_oos' not in item or 'oos_monte_carlo' not in item:
                  raise SystemExit('Bayesian/Monte Carlo validation missing from strategy output')
          if am.get('decision') not in {'NO_TRADE','LONG','SHORT','WAIT'} or am.get('monte_carlo',{}).get('paths') != 10000:
              raise SystemExit('ARIMA/Monte Carlo output invalid')
          print('ARIMA_MC_OK', am['decision'], 'ARIMA=', am['arima']['order'], 'P_UP=', am['monte_carlo']['probability_terminal_up'])
          PY

      - name: Upload reproducible report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqao-step-index-arima-mc-${{ github.run_number }}
          path: |
            DATA/step_index_quant_report.pdf
            DATA/step_index_quant_report.json
            DATA/step_index_strategy_lab.pdf
            DATA/step_index_strategy_lab.json
            DATA/step_index_arima_mc.pdf
            DATA/step_index_arima_mc.json
            DATA/step_index_cost_sensitivity.pdf
            DATA/step_index_cost_sensitivity.json
            DATA/step_index_mc_paths.png
            DATA/step_index_mc_distribution.png
            DATA/step_index_arima_oos.png
          if-no-files-found: error
          retention-days: 30
